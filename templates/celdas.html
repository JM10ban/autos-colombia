{% extends 'base.html' %}{% block content %}<p class="eyebrow">OCUPACIÓN</p><h1>Estado de las celdas</h1><section class="panel"><div class="cell-grid">{% for c in celdas %}<article class="cell {{ c.estado.replace(' ','-') }}"><span>{{ c.codigo }}</span><strong>{{ c.estado|title }}</strong>{% if c.placa %}<small>{{ c.placa }}</small>{% endif %}</article>{% endfor %}</div></section>{% endblock %}
